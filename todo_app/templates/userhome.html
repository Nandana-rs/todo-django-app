{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <style>
        body { 
            font-family: Arial; 
            background: #e9ecef; 
            margin: 0; 
            padding: 0; }
        header { 
            background: #343a40; 
            color: white;
             padding: 1em; 
             text-align: center; }
        .content { 
            text-align: center; 
            margin-top: 100px; }
    </style>
</head>
<body>
<header>

</header>
<div class="content">
    <h2>Hello, {{ user.username }}!</h2>
    <p>Manage your tasks easily with TodoMate.</p>
    <a href="{% url 'task-list' %}" style="
    display: inline-block;
    padding: 10px 20px;
    margin-top: 20px;
    background-color: #007bff;
    color: white;
    text-decoration: none;
    border-radius: 5px;
">
